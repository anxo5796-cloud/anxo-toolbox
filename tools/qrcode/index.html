<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二维码生成</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
  .page { max-width: 1060px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 56px; }
  .head { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .head h1 { margin: 0; font-size: 1.4rem; flex: 1 1 auto; }

  /* 电脑：左边填内容和设置，右边二维码固定；手机：内容、二维码、设置依次排 */
  .layout { display: grid; gap: 20px 24px; align-items: start;
    grid-template-columns: minmax(0, 1fr) 360px;
    grid-template-areas: "content preview" "options preview"; }
  #content { grid-area: content; }
  #preview { grid-area: preview; position: sticky; top: 16px; }
  #options { grid-area: options; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-areas: "content" "preview" "options"; }
    #preview { position: static; }
  }

  .box { padding: 16px; background: var(--paper); border: 2px solid var(--edge); border-radius: 6px; box-shadow: 4px 4px 0 var(--edge); }
  .box h2 { margin: 0 0 12px; font-size: 1rem; }

  .fields { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fields .wide { grid-column: 1 / -1; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
  label.f { display: block; font-size: .85rem; font-weight: 600; color: var(--ink-2); }
  label.f .field { margin-top: 4px; font-weight: 400; color: var(--ink); }
  #text { min-height: 130px; }
  .hint { margin: 8px 0 0; color: var(--ink-2); font-size: .88rem; }
  .chk { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: .95rem; }
  .chk input { width: 20px; height: 20px; }

  /* 二维码预览 */
  .stage { display: flex; align-items: center; justify-content: center; min-height: 300px; padding: 14px; border: 2px dashed var(--line); border-radius: 6px; background: #fff; }
  #qr { display: block; width: 100%; max-width: 320px; height: auto; image-rendering: pixelated; cursor: zoom-in; }
  #empty { margin: 0; padding: 0 16px; text-align: center; color: #51606E; }
  #info { margin: 10px 0 0; min-height: 1.5em; font-size: .88rem; color: var(--ink-2); text-align: center; }
  #err { margin: 10px 0 0; color: var(--red); font-size: .92rem; text-align: center; }
  #err:empty { display: none; }
  .btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }

  /* 设置 */
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .row .seg button { white-space: nowrap; padding: 0 12px; }
  .row > .k { flex: none; width: 4.2em; font-size: .9rem; font-weight: 600; color: var(--ink-2); }
  .row input[type="range"] { flex: 1 1 140px; min-width: 0; height: 32px; accent-color: var(--yellow); }
  .row output { flex: none; min-width: 3.4em; text-align: right; font-family: var(--mono); font-size: .85rem; color: var(--ink-2); }
  input[type="color"] { width: 44px; height: 36px; padding: 0; border: 2px solid var(--edge); border-radius: 6px; background: none; cursor: pointer; }
  #warn { margin: 10px 0 0; font-size: .88rem; color: var(--red); }
  #warn:empty { display: none; }

  /* 全屏展示：二维码铺满，方便别人直接扫 */
  #big { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; cursor: zoom-out; }
  #big canvas { display: block; image-rendering: pixelated; }
  #big span { padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: .9rem; }

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 12; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; pointer-events: none; }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <a class="back" href="../../">‹ 工具箱</a>
    <h1>二维码生成</h1>
    <div class="seg" role="group" aria-label="内容类型">
      <button type="button" data-mode="text" aria-pressed="true">文本 / 网址</button>
      <button type="button" data-mode="wifi" aria-pressed="false">Wi-Fi</button>
      <button type="button" data-mode="card" aria-pressed="false">名片</button>
    </div>
  </div>

  <div class="layout">
    <section class="box" id="content" aria-label="内容">
      <div data-pane="text">
        <label class="f" for="text">要编码的内容</label>
        <textarea id="text" class="field" spellcheck="false" placeholder="例如：https://example.com"></textarea>
        <p class="hint">网址请带上 https://，否则有些手机扫出来会当成普通文字。</p>
      </div>

      <div data-pane="wifi" class="fields" hidden>
        <label class="f wide">网络名称（SSID）<input id="wSsid" class="field" autocomplete="off" autocapitalize="none"></label>
        <label class="f">密码<input id="wPass" class="field" autocomplete="off" autocapitalize="none"></label>
        <label class="f">加密方式
          <select id="wType" class="field">
            <option value="WPA">WPA / WPA2 / WPA3</option>
            <option value="WEP">WEP</option>
            <option value="nopass">无密码</option>
          </select>
        </label>
        <label class="chk wide"><input type="checkbox" id="wHidden"> 隐藏网络</label>
      </div>

      <div data-pane="card" class="fields" hidden>
        <label class="f">姓名<input id="cName" class="field" autocomplete="off"></label>
        <label class="f">电话<input id="cTel" class="field" inputmode="tel" autocomplete="off"></label>
        <label class="f">邮箱<input id="cMail" class="field" inputmode="email" autocomplete="off" autocapitalize="none"></label>
        <label class="f">网址<input id="cUrl" class="field" autocomplete="off" autocapitalize="none"></label>
        <label class="f">公司<input id="cOrg" class="field" autocomplete="off"></label>
        <label class="f">职位<input id="cTitle" class="field" autocomplete="off"></label>
      </div>
    </section>

    <section class="box" id="preview" aria-label="二维码">
      <div class="stage">
        <canvas id="qr" hidden aria-label="二维码，点一下全屏展示"></canvas>
        <p id="empty">填好内容，二维码就会出现在这里。</p>
      </div>
      <p id="info"></p>
      <p id="err" role="alert"></p>
      <div class="btns">
        <button type="button" class="btn btn-primary" id="dlPng" disabled>下载 PNG</button>
        <button type="button" class="btn" id="dlSvg" disabled>下载 SVG</button>
        <button type="button" class="btn" id="copy" disabled>复制图片</button>
        <button type="button" class="btn" id="show" disabled>全屏展示</button>
      </div>
    </section>

    <section class="box" id="options" aria-label="设置">
      <h2>外观与容错</h2>
      <div class="row"><span class="k">纠错</span>
        <div class="seg" id="ecc" role="group" aria-label="纠错等级">
          <button type="button" data-v="L">L 7%</button>
          <button type="button" data-v="M">M 15%</button>
          <button type="button" data-v="Q">Q 25%</button>
          <button type="button" data-v="H">H 30%</button>
        </div>
      </div>
      <div class="row"><span class="k">样式</span>
        <div class="seg" id="style" role="group" aria-label="样式">
          <button type="button" data-v="square">方块</button>
          <button type="button" data-v="dot">圆点</button>
        </div>
      </div>
      <div class="row"><span class="k">导出尺寸</span>
        <input type="range" id="size" min="256" max="2048" step="64" aria-label="导出尺寸"><output id="sizeO"></output>
      </div>
      <div class="row"><span class="k">留白</span>
        <input type="range" id="margin" min="0" max="10" step="1" aria-label="留白"><output id="marginO"></output>
      </div>
      <div class="row"><span class="k">颜色</span>
        <label class="chk" style="min-height:0">前景 <input type="color" id="fg"></label>
        <label class="chk" style="min-height:0">背景 <input type="color" id="bg"></label>
        <button type="button" class="btn btn-sm" id="reset">恢复默认</button>
      </div>
      <p id="warn" role="status"></p>
      <p class="hint">纠错等级越高，二维码越密，但被遮挡或磨损后越容易扫出来。一般用 M，贴在户外或要印刷时用 Q 或 H。</p>
    </section>
  </div>
</div>

<div id="big" hidden role="dialog" aria-label="全屏二维码"><canvas id="bigCv"></canvas><span>点一下关闭</span></div>
<div id="toast" hidden></div>

<script src="../../assets/vendor/qrcode.js"></script>
<script src="../../assets/common.js"></script>
<script>
(function () {
  'use strict';
  const $ = TB.$, $$ = TB.$$;

  const DEF = { mode: 'text', text: '', ecc: 'M', style: 'square', size: 768, margin: 4, fg: '#000000', bg: '#FFFFFF' };
  const cfg = Object.assign({}, DEF, TB.store.get('qr.cfg', {}));
  const hex = (v, d) => (typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v)) ? v : d;
  const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, Math.round(v))) : d;
  cfg.mode = ['text', 'wifi', 'card'].indexOf(cfg.mode) !== -1 ? cfg.mode : 'text';
  cfg.text = typeof cfg.text === 'string' ? cfg.text.slice(0, 4000) : '';
  cfg.ecc = ['L', 'M', 'Q', 'H'].indexOf(cfg.ecc) !== -1 ? cfg.ecc : 'M';
  cfg.style = cfg.style === 'dot' ? 'dot' : 'square';
  cfg.size = num(cfg.size, 256, 2048, DEF.size);
  cfg.margin = num(cfg.margin, 0, 10, DEF.margin);
  cfg.fg = hex(cfg.fg, DEF.fg); cfg.bg = hex(cfg.bg, DEF.bg);
  // 只保存模式、文本和外观；Wi-Fi 密码、名片信息不落地
  const save = () => TB.store.set('qr.cfg', cfg);

  /* ---------- 内容拼装 ---------- */
  const val = id => $('#' + id).value.trim();
  const escWifi = s => s.replace(/([\\;,:"])/g, '\\$1');
  const escCard = s => s.replace(/([\\;,])/g, '\\$1').replace(/\r?\n/g, '\\n');

  function payload() {
    if (cfg.mode === 'text') return $('#text').value;
    if (cfg.mode === 'wifi') {
      const ssid = val('wSsid');
      if (!ssid) return '';
      const t = $('#wType').value;
      let s = 'WIFI:T:' + t + ';S:' + escWifi(ssid) + ';';
      if (t !== 'nopass') s += 'P:' + escWifi($('#wPass').value) + ';';
      if ($('#wHidden').checked) s += 'H:true;';
      return s + ';';
    }
    const name = val('cName'), tel = val('cTel'), mail = val('cMail'), url = val('cUrl'), org = val('cOrg'), title = val('cTitle');
    if (!name && !tel && !mail && !url && !org) return '';
    const L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + escCard(name) + ';;;;', 'FN:' + escCard(name)];
    if (org) L.push('ORG:' + escCard(org));
    if (title) L.push('TITLE:' + escCard(title));
    if (tel) L.push('TEL;TYPE=CELL:' + escCard(tel));
    if (mail) L.push('EMAIL:' + escCard(mail));
    if (url) L.push('URL:' + escCard(url));
    L.push('END:VCARD');
    return L.join('\n');
  }

  /* ---------- 生成与绘制 ---------- */
  let cur = null;   // {n, dark(r,c)}

  function build(text) {
    const q = qrcode(0, cfg.ecc);
    q.addData(text, 'Byte');
    q.make();
    const n = q.getModuleCount(), ver = (n - 17) / 4;
    return { n: n, dark: (r, c) => q.isDark(r, c), ver: ver, sq: squareMask(n, ver) };
  }

  // 圆点样式只作用于数据区；定位图案、对齐图案、时序线、格式信息保持方块，扫码软件才稳
  function alignCenters(ver) {
    if (ver === 1) return [];
    const num = Math.floor(ver / 7) + 2, size = ver * 4 + 17;
    const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (num * 2 - 2)) * 2;
    const out = [6];
    for (let pos = size - 7; out.length < num; pos -= step) out.splice(1, 0, pos);
    return out;
  }
  function squareMask(n, ver) {
    const mask = [];
    for (let r = 0; r < n; r++) {
      mask.push(new Array(n).fill(false));
      for (let c = 0; c < n; c++) {
        if ((r < 9 && c < 9) || (r < 9 && c >= n - 8) || (r >= n - 8 && c < 9) || r === 6 || c === 6) mask[r][c] = true;
      }
    }
    const a = alignCenters(ver), last = a.length - 1;
    a.forEach((cy, i) => a.forEach((cx, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) mask[cy + dr][cx + dc] = true;
    }));
    return mask;
  }
  const keepSquare = (r, c) => cur.sq[r][c];

  // 把二维码画到 canvas 上，每个模块 scale 像素（整数，边缘清晰）
  function paint(cv, scale) {
    const n = cur.n, m = cfg.margin, total = n + 2 * m;
    cv.width = cv.height = total * scale;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = cfg.bg; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = cfg.fg;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!cur.dark(r, c)) continue;
      const x = (c + m) * scale, y = (r + m) * scale;
      if (cfg.style === 'dot' && !keepSquare(r, c)) {
        ctx.beginPath(); ctx.arc(x + scale / 2, y + scale / 2, scale * 0.47, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillRect(x, y, scale, scale);
      }
    }
  }

  function toSvg() {
    const n = cur.n, m = cfg.margin, total = n + 2 * m;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (!cur.dark(r, c)) continue;
      const x = c + m, y = r + m;
      if (cfg.style === 'dot' && !keepSquare(r, c)) {
        const cx = x + 0.5, cy = y + 0.5, rr = 0.47;
        d += 'M' + (cx - rr) + ' ' + cy + 'a' + rr + ' ' + rr + ' 0 1 0 ' + (2 * rr) + ' 0a' + rr + ' ' + rr + ' 0 1 0 ' + (-2 * rr) + ' 0z';
      } else {
        d += 'M' + x + ' ' + y + 'h1v1h-1z';
      }
    }
    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' ' + total + '" width="' + cfg.size + '" height="' + cfg.size + '" shape-rendering="crispEdges">' +
      '<rect width="' + total + '" height="' + total + '" fill="' + cfg.bg + '"/>' +
      '<path fill="' + cfg.fg + '" d="' + d + '"/></svg>\n';
  }

  const lumOf = h => {
    const v = parseInt(h.slice(1), 16);
    const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(v >> 16 & 255) + 0.7152 * f(v >> 8 & 255) + 0.0722 * f(v & 255);
  };

  function checkColors() {
    const a = lumOf(cfg.fg), b = lumOf(cfg.bg);
    const ratio = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    let w = '';
    if (a > b) w = '前景比背景浅（反色），不少扫码软件识别不了，建议深色前景配浅色背景。';
    else if (ratio < 4) w = '前景和背景对比偏低，可能扫不出来。';
    else if (cfg.margin < 4) w = '留白小于 4 格时，部分扫码软件可能识别不了。';
    $('#warn').textContent = w;
  }

  function setButtons(on) { ['dlPng', 'dlSvg', 'copy', 'show'].forEach(id => { $('#' + id).disabled = !on; }); }

  function render() {
    const text = payload();
    $('#err').textContent = '';
    checkColors();
    if (!text) {
      cur = null; $('#qr').hidden = true; $('#empty').hidden = false; $('#info').textContent = ''; setButtons(false);
      return;
    }
    try {
      cur = build(text);
    } catch (e) {
      cur = null; $('#qr').hidden = true; $('#empty').hidden = false; $('#info').textContent = ''; setButtons(false);
      $('#err').textContent = '内容太长，放不进二维码。可以缩短内容，或把纠错等级调低（L 容量最大）。';
      return;
    }
    const total = cur.n + 2 * cfg.margin;
    const scale = Math.max(1, Math.round(cfg.size / total));
    paint($('#qr'), scale);
    $('#qr').hidden = false; $('#empty').hidden = true;
    const bytes = new TextEncoder().encode(text).length;
    $('#info').textContent = bytes + ' 字节，版本 ' + cur.ver + '（' + cur.n + '×' + cur.n + ' 格），导出 ' + (total * scale) + '×' + (total * scale) + ' px';
    setButtons(true);
  }

  let timer = 0;
  const later = () => { clearTimeout(timer); timer = setTimeout(render, 120); };

  /* ---------- 界面同步 ---------- */
  function sync() {
    $$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === cfg.mode)));
    $$('[data-pane]').forEach(p => { p.hidden = p.getAttribute('data-pane') !== cfg.mode; });
    $$('#ecc button').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === cfg.ecc)));
    $$('#style button').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === cfg.style)));
    $('#size').value = cfg.size; $('#sizeO').textContent = cfg.size + ' px';
    $('#margin').value = cfg.margin; $('#marginO').textContent = cfg.margin + ' 格';
    $('#fg').value = cfg.fg; $('#bg').value = cfg.bg;
  }

  function toast(t) {
    const el = $('#toast');
    el.textContent = t; el.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { el.hidden = true; }, 2000);
  }

  /* ---------- 事件 ---------- */
  $$('[data-mode]').forEach(b => b.addEventListener('click', () => { cfg.mode = b.getAttribute('data-mode'); save(); sync(); render(); }));
  $('#text').addEventListener('input', e => { cfg.text = e.target.value.slice(0, 4000); save(); later(); });
  ['wSsid', 'wPass', 'wType', 'wHidden', 'cName', 'cTel', 'cMail', 'cUrl', 'cOrg', 'cTitle'].forEach(id => {
    $('#' + id).addEventListener('input', later);
    $('#' + id).addEventListener('change', later);
  });

  $('#ecc').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cfg.ecc = b.getAttribute('data-v'); save(); sync(); render(); } });
  $('#style').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cfg.style = b.getAttribute('data-v'); save(); sync(); render(); } });
  $('#size').addEventListener('input', e => { cfg.size = +e.target.value; $('#sizeO').textContent = cfg.size + ' px'; save(); later(); });
  $('#margin').addEventListener('input', e => { cfg.margin = +e.target.value; $('#marginO').textContent = cfg.margin + ' 格'; save(); later(); });
  $('#fg').addEventListener('input', e => { cfg.fg = e.target.value; save(); later(); });
  $('#bg').addEventListener('input', e => { cfg.bg = e.target.value; save(); later(); });
  $('#reset').addEventListener('click', () => {
    ['ecc', 'style', 'size', 'margin', 'fg', 'bg'].forEach(k => { cfg[k] = DEF[k]; });
    save(); sync(); render();
  });

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  $('#dlPng').addEventListener('click', () => {
    if (!cur) return;
    $('#qr').toBlob(b => { if (b) download(b, 'qrcode.png'); }, 'image/png');
  });
  $('#dlSvg').addEventListener('click', () => {
    if (cur) download(new Blob([toSvg()], { type: 'image/svg+xml' }), 'qrcode.svg');
  });

  if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) $('#copy').hidden = true;
  $('#copy').addEventListener('click', () => {
    if (!cur) return;
    $('#qr').toBlob(b => {
      if (!b) return;
      navigator.clipboard.write([new ClipboardItem({ 'image/png': b })])
        .then(() => toast('已复制图片'), () => toast('复制失败，请改用下载'));
    }, 'image/png');
  });

  /* 全屏展示 */
  function openBig() {
    if (!cur) return;
    const total = cur.n + 2 * cfg.margin;
    const avail = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    paint($('#bigCv'), Math.max(1, Math.floor(avail / total)));
    $('#big').style.background = cfg.bg;
    $('#big').hidden = false;
  }
  function closeBig() { $('#big').hidden = true; }
  $('#show').addEventListener('click', openBig);
  $('#qr').addEventListener('click', openBig);
  $('#big').addEventListener('click', closeBig);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBig(); });
  window.addEventListener('resize', () => { if (!$('#big').hidden) openBig(); });

  /* ---------- 启动 ---------- */
  $('#text').value = cfg.text;
  sync();
  render();
})();
</script>
</body>
</html>
