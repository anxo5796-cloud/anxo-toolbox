<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理工具列表</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 90px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 8px; }
  .head h1 { margin: 0; font-size: 1.5rem; flex: 1 1 auto; }
  .lead { margin: 0 0 18px; color: var(--ink-2); font-size: .95rem; }

  .banner { margin: 0 0 16px; padding: 12px 14px; border: 2px solid var(--edge); border-radius: 6px; background: var(--paper); }
  .banner .btn { margin-top: 8px; }

  .panel { margin-bottom: 20px; padding: 16px; border: 2px solid var(--edge); border-radius: 6px; background: var(--paper); box-shadow: 4px 4px 0 var(--edge); }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  label.f { display: block; font-size: .85rem; font-weight: 600; color: var(--ink-2); }
  label.f .field { margin-top: 4px; font-weight: 400; color: var(--ink); }
  label.f.wide { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .row-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row-head .ttl { flex: 1 1 140px; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-head .ttl span { margin-right: 8px; }
  .hide-chk { display: flex; align-items: center; gap: 8px; font-size: .9rem; margin-top: 4px; min-height: 36px; }
  .hide-chk input { width: 20px; height: 20px; }
  .err { margin: 10px 0 0; color: var(--red); font-size: .88rem; }
  .err:empty { display: none; }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--paper); border-top: 2px solid var(--edge);
  }
  .dock-in { max-width: 880px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  #status { flex: 1 1 160px; font-size: .9rem; color: var(--ink-2); }
  #status.bad { color: var(--red); font-weight: 600; }
  code { font-family: var(--mono); font-size: .9em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>管理工具列表</h1>
    <a class="back" href="../">首页</a>
  </div>
  <p class="lead">这里改的是 <code>tools.json</code>。改完点“导出”，把下载的文件替换到项目根目录，再推送到 GitHub 就会重新部署。</p>

  <div id="banner" class="banner" hidden>
    浏览器里有一份还没导出的草稿，已经载入。
    <div><button type="button" class="btn btn-sm" id="discard">放弃草稿，重新载入线上版本</button></div>
  </div>

  <section class="panel">
    <h2>站点信息</h2>
    <div class="grid2">
      <label class="f">标题<input class="field" id="siteTitle" autocomplete="off"></label>
      <label class="f">副标题<input class="field" id="siteSub" autocomplete="off"></label>
    </div>
  </section>

  <ul id="list"></ul>
</div>

<div class="dock">
  <div class="dock-in">
    <button type="button" class="btn btn-sm" id="add">添加工具</button>
    <button type="button" class="btn btn-sm" id="import">导入</button>
    <button type="button" class="btn btn-sm" id="copy">复制 JSON</button>
    <span id="status" role="status"></span>
    <button type="button" class="btn btn-primary" id="export">导出 tools.json</button>
  </div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script src="../assets/common.js"></script>
<script>
(function () {
  'use strict';
  var $ = TB.$, esc = TB.esc;
  var DRAFT = 'admin.draft';
  var state = { site: { title: '', subtitle: '' }, tools: [] };

  function normalize(d) {
    d = d || {};
    var s = d.site || {};
    return {
      site: { title: String(s.title || ''), subtitle: String(s.subtitle || '') },
      tools: (Array.isArray(d.tools) ? d.tools : []).map(function (t) {
        return {
          id: String(t.id || ''), name: String(t.name || ''), desc: String(t.desc || ''),
          category: String(t.category || ''), icon: String(t.icon || ''), path: String(t.path || ''),
          tags: Array.isArray(t.tags) ? t.tags.map(String) : [], hidden: !!t.hidden
        };
      })
    };
  }

  function clean() {
    return {
      site: { title: state.site.title, subtitle: state.site.subtitle },
      tools: state.tools.map(function (t) {
        var o = { id: t.id.trim(), name: t.name.trim(), desc: t.desc.trim(), category: t.category.trim(),
                  icon: t.icon.trim(), path: t.path.trim(), tags: t.tags };
        if (t.hidden) o.hidden = true;
        return o;
      })
    };
  }

  function errorsFor(t, i) {
    var e = [];
    if (!t.name.trim()) e.push('名称不能为空');
    if (!t.id.trim()) e.push('id 不能为空');
    else if (state.tools.some(function (o, j) { return j !== i && o.id.trim() === t.id.trim(); })) e.push('id 与其他工具重复');
    if (!t.path.trim()) e.push('路径不能为空');
    return e;
  }

  function validateAll() {
    var total = 0;
    var rows = document.querySelectorAll('#list > li');
    state.tools.forEach(function (t, i) {
      var e = errorsFor(t, i);
      total += e.length;
      if (rows[i]) rows[i].querySelector('.err').textContent = e.join('；');
    });
    var st = $('#status');
    if (total) { st.textContent = '有 ' + total + ' 处需要修正，修正后才能导出'; st.className = 'bad'; }
    else { st.textContent = '共 ' + state.tools.length + ' 个工具'; st.className = ''; }
    $('#export').disabled = total > 0;
    $('#copy').disabled = total > 0;
    return total;
  }

  function saveDraft() { TB.store.set(DRAFT, state); }

  function rowHtml(t, i) {
    return '<li class="panel" data-i="' + i + '">' +
      '<div class="row-head">' +
        '<div class="ttl"><span>' + esc(t.icon || '🔧') + '</span><span class="ttl-name">' + esc(t.name || '未命名') + '</span></div>' +
        '<button type="button" class="btn btn-sm" data-act="up"' + (i === 0 ? ' disabled' : '') + '>上移</button>' +
        '<button type="button" class="btn btn-sm" data-act="down"' + (i === state.tools.length - 1 ? ' disabled' : '') + '>下移</button>' +
        '<button type="button" class="btn btn-sm btn-danger" data-act="del">删除</button>' +
      '</div>' +
      '<div class="grid2">' +
        '<label class="f">名称<input class="field" data-f="name" value="' + esc(t.name) + '" autocomplete="off"></label>' +
        '<label class="f">图标（一个 emoji）<input class="field" data-f="icon" value="' + esc(t.icon) + '" autocomplete="off"></label>' +
        '<label class="f">id（英文，唯一）<input class="field" data-f="id" value="' + esc(t.id) + '" autocomplete="off" autocapitalize="none"></label>' +
        '<label class="f">路径<input class="field" data-f="path" value="' + esc(t.path) + '" autocomplete="off" autocapitalize="none"></label>' +
        '<label class="f">分类<input class="field" data-f="category" value="' + esc(t.category) + '" autocomplete="off"></label>' +
        '<label class="f">标签（逗号分隔）<input class="field" data-f="tags" value="' + esc(t.tags.join('，')) + '" autocomplete="off"></label>' +
        '<label class="f wide">一句话说明<input class="field" data-f="desc" value="' + esc(t.desc) + '" autocomplete="off"></label>' +
      '</div>' +
      '<label class="hide-chk"><input type="checkbox" data-f="hidden"' + (t.hidden ? ' checked' : '') + '> 在首页隐藏</label>' +
      '<p class="err" role="alert"></p>' +
    '</li>';
  }

  function renderList() {
    $('#list').innerHTML = state.tools.map(rowHtml).join('');
    validateAll();
  }

  function renderSite() {
    $('#siteTitle').value = state.site.title;
    $('#siteSub').value = state.site.subtitle;
  }

  function setState(d) { state = normalize(d); renderSite(); renderList(); }

  // 输入：只改数据，不重绘列表，避免打断输入
  $('#list').addEventListener('input', function (e) {
    var el = e.target, f = el.getAttribute('data-f');
    if (!f) return;
    var li = el.closest('li'), i = +li.getAttribute('data-i'), t = state.tools[i];
    if (f === 'hidden') t.hidden = el.checked;
    else if (f === 'tags') t.tags = el.value.split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean);
    else t[f] = el.value;
    if (f === 'name') li.querySelector('.ttl-name').textContent = t.name || '未命名';
    if (f === 'icon') li.querySelector('.ttl span').textContent = t.icon || '🔧';
    saveDraft();
    validateAll();
  });

  // 结构变化：重绘
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var li = b.closest('li'), i = +li.getAttribute('data-i'), act = b.getAttribute('data-act');
    if (act === 'del') {
      if (!confirm('删除“' + (state.tools[i].name || '未命名') + '”？这只会从列表里移除，不会删除工具文件。')) return;
      state.tools.splice(i, 1);
    } else if (act === 'up' && i > 0) {
      state.tools.splice(i - 1, 0, state.tools.splice(i, 1)[0]);
    } else if (act === 'down' && i < state.tools.length - 1) {
      state.tools.splice(i + 1, 0, state.tools.splice(i, 1)[0]);
    }
    saveDraft();
    renderList();
  });

  $('#siteTitle').addEventListener('input', function (e) { state.site.title = e.target.value; saveDraft(); });
  $('#siteSub').addEventListener('input', function (e) { state.site.subtitle = e.target.value; saveDraft(); });

  $('#add').addEventListener('click', function () {
    var n = 1, id;
    do { id = 'new-tool' + (n > 1 ? '-' + n : ''); n++; } while (state.tools.some(function (t) { return t.id === id; }));
    state.tools.push({ id: id, name: '', desc: '', category: '', icon: '🔧', path: 'tools/' + id + '/', tags: [], hidden: false });
    saveDraft();
    renderList();
    var rows = document.querySelectorAll('#list > li');
    var last = rows[rows.length - 1];
    last.scrollIntoView({ block: 'center' });
    last.querySelector('[data-f="name"]').focus();
  });

  function jsonText() { return JSON.stringify(clean(), null, 2) + '\n'; }

  $('#export').addEventListener('click', function () {
    if (validateAll()) return;
    var blob = new Blob([jsonText()], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tools.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    $('#status').textContent = '已导出。把文件放到项目根目录替换原来的 tools.json。';
  });

  $('#copy').addEventListener('click', function () {
    if (validateAll()) return;
    var text = jsonText();
    function done() { $('#status').textContent = '已复制 JSON'; }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { $('#status').textContent = '复制失败，请改用导出'; }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });

  $('#import').addEventListener('click', function () { $('#file').click(); });
  $('#file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || !Array.isArray(d.tools)) throw new Error('缺少 tools 数组');
        setState(d);
        saveDraft();
        $('#status').textContent = '已导入 ' + state.tools.length + ' 个工具';
      } catch (err) {
        $('#status').textContent = '导入失败：' + err.message;
        $('#status').className = 'bad';
      }
    };
    rd.readAsText(f);
    e.target.value = '';
  });

  function loadRemote() {
    return fetch('../tools.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  $('#discard').addEventListener('click', function () {
    TB.store.del(DRAFT);
    $('#banner').hidden = true;
    loadRemote().then(setState).catch(function () {
      $('#status').textContent = '读不到 tools.json（需要通过服务器访问，不能直接双击打开）';
      $('#status').className = 'bad';
    });
  });

  var draft = TB.store.get(DRAFT, null);
  if (draft && Array.isArray(draft.tools)) {
    $('#banner').hidden = false;
    setState(draft);
  } else {
    loadRemote().then(setState).catch(function () {
      renderSite(); renderList();
      $('#status').textContent = '读不到 tools.json（需要通过服务器访问，不能直接双击打开）。也可以点“导入”选择文件。';
      $('#status').className = 'bad';
    });
  }
})();
</script>
</body>
</html>
